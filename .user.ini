; Per-folder PHP settings for cPanel PHP-FPM hosting (picked up within ~5 minutes of a deploy).
; Bigger request limits let Compose upload videos in fewer, larger pieces. If the host
; ignores this file, uploads still work, just in smaller pieces.
upload_max_filesize = 64M
post_max_size = 64M
max_execution_time = 300
max_input_time = 300
